# Core competencies. `highlighted` are the 10 chips shown by default (in order).
# `groups` are the six rows shown under "Show all". Every highlighted chip must appear in a group.

core:
  heading: Core competencies
  highlighted:
    - AI Strategy & Adoption
    - Digital Transformation
    - Enterprise Strategy & Roadmapping
    - Operating Model & KPI Design
    - Business Case & Investment Prioritization
    - Cross-Functional & People Leadership
    - Executive & Board Communication
    - Organizational Change Management
    - Claude & Claude Code
    - Tableau
  groups:
    - name: AI & Transformation
      items:
        - AI Strategy & Adoption
        - Digital Transformation
        - AI-Augmented Workflow Design
        - Technology Risk & Governance
    - name: Business & Strategy
      items:
        - Enterprise Strategy & Roadmapping
        - Operating Model & KPI Design
        - Business Case & Investment Prioritization
        - Vendor Management & Cost Optimization
    - name: Leadership
      items:
        - Program & Portfolio Leadership
        - Cross-Functional & People Leadership
        - Organizational Change Management
        - Executive & Board Communication
        - Process Optimization & Lean
    - name: AI Tools
      items:
        - Amazon Kiro
        - Claude & Claude Code
        - Anthropic & OpenAI APIs
        - MCP / Multi-Agent Workflows
        - Local LLMs (LM Studio)
        - Gemini
        - Microsoft 365 Copilot
        - Python
    - name: Data & Analytics
      items:
        - SQL (MySQL)
        - Tableau
        - Power BI
        - Excel (Advanced Modeling)
    - name: Enterprise Platforms
      items:
        - ServiceNow (CMDB / ITAM)
        - Jira
        - Salesforce
  # "{n}" is replaced with the computed total.
  showAllLabel: "Show all {n} +"
  showFewerLabel: Show fewer −
